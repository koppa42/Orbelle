name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      release-tag:
        type: string
        default: ''
    outputs:
      version:
        value: ${{ jobs.metadata.outputs.version }}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUTF8: '1'
  VCPKG_DISABLE_METRICS: '1'
  VCPKG_MAX_CONCURRENCY: '4'
  CMAKE_BUILD_PARALLEL_LEVEL: '4'
  CTEST_PARALLEL_LEVEL: '4'

jobs:
  metadata:
    name: Versions and tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      vcpkg-baseline: ${{ steps.version.outputs.vcpkg-baseline }}
      baseline-python: ${{ steps.version.outputs.baseline-python }}
      python-matrix: ${{ steps.version.outputs.python-matrix }}
      python-versions: ${{ steps.version.outputs.python-versions }}
      scope: ${{ steps.plan.outputs.scope }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # Push classification needs the whole before..after range; release
          # verification also needs main and the tag, including older commits.
          fetch-depth: ${{ github.event_name == 'push' && '0' || '2' }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Check versions and release tag
        id: version
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          args=()
          if [[ -n "$RELEASE_TAG" ]]; then args+=(--tag "$RELEASE_TAG"); fi
          python tools/ci/version.py --github-output "${args[@]}"
      - name: Require release commit on main
        if: inputs.release-tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: python tools/ci/verify_release.py --tag "$RELEASE_TAG"
      - name: Lint GitHub Actions workflows
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$archive"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - name: Select required checks
        id: plan
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: python tools/ci/plan_ci.py plan
      - name: Test data and delivery tools
        run: |
          python -m unittest discover -s tools/data/tests -v
          python -m unittest discover -s tests/packaging -v

  linux:
    name: Linux C++
    needs: metadata
    if: needs.metadata.outputs.scope == 'full' || needs.metadata.outputs.scope == 'baseline' || needs.metadata.outputs.scope == 'release'
    runs-on: ubuntu-24.04
    # Every Release numerical regression still runs with its original tolerances.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ needs.metadata.outputs.baseline-python }}
      - name: Identify runner image
        id: toolchain
        run: echo "image=$ImageVersion" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: microsoft/vcpkg
          ref: ${{ needs.metadata.outputs.vcpkg-baseline }}
          path: out/tools/vcpkg
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: ${{ runner.temp }}/linux/dependencies/binary-cache
          key: vcpkg-ubuntu24-x64-v1-${{ steps.toolchain.outputs.image }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/ports/**', 'tools/ci/check_linux.py') }}
          restore-keys: |
            vcpkg-ubuntu24-x64-v1-${{ steps.toolchain.outputs.image }}-
            vcpkg-ubuntu24-x64-v1-
      - name: Prepare toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang ninja-build ncompress pkg-config python3-dev python3-venv
          out/tools/vcpkg/bootstrap-vcpkg.sh -disableMetrics
      - uses: ./.github/actions/compiler-cache
      - name: Compile and test; package only for a release tag
        env:
          CI_SCOPE: ${{ needs.metadata.outputs.scope }}
        run: |
          args=(--stage tests --skip-python)
          if [[ "$CI_SCOPE" == release ]]; then
            args=(--stage package --delivery "$RUNNER_TEMP/delivery")
          fi
          python tools/ci/check_linux.py --source "$GITHUB_WORKSPACE" \
            --vcpkg-root "$GITHUB_WORKSPACE/out/tools/vcpkg" \
            --work "$RUNNER_TEMP/linux" --reports "$RUNNER_TEMP/reports/linux-build" \
            "${args[@]}"
      - name: Export release installation test inputs
        if: inputs.release-tag != ''
        run: |
          tar -czf "$RUNNER_TEMP/linux-delivery.tar.gz" -C "$RUNNER_TEMP/delivery" .
      - name: Upload Linux release installation inputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: inputs.release-tag != ''
        with:
          name: linux-delivery
          path: ${{ runner.temp }}/linux-delivery.tar.gz
          compression-level: 0
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Summarize command timings
        if: always()
        shell: bash
        run: python tools/ci/summarize_timings.py --reports "$RUNNER_TEMP/reports"
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: linux-build-reports
          path: ${{ runner.temp }}/reports
          overwrite: true
          retention-days: 14

  linux-consumer:
    name: Linux SDK and installed Python API
    needs: [metadata, linux]
    if: needs.metadata.outputs.scope == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Deliberately no source checkout: the delivery must work on its own.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ needs.metadata.outputs.baseline-python }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: linux-delivery
          path: ${{ runner.temp }}/input
      - name: Validate relocated SDK and wheel
        run: |
          mkdir "$RUNNER_TEMP/delivery"
          tar -xzf "$RUNNER_TEMP/input/linux-delivery.tar.gz" -C "$RUNNER_TEMP/delivery"
          python "$RUNNER_TEMP/delivery/check_linux.py" --stage consumer \
            --delivery "$RUNNER_TEMP/delivery" --work "$RUNNER_TEMP/consumer" \
            --reports "$RUNNER_TEMP/reports/linux-consumer"
      - name: Prepare release assets
        if: inputs.release-tag != ''
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          python "$RUNNER_TEMP/delivery/package_sdk.py" --sdk "$RUNNER_TEMP/delivery/sdk" \
            --dependencies "$RUNNER_TEMP/delivery/dependencies" --version "$VERSION" \
            --platform linux-x64 --output "$RUNNER_TEMP/assets"
          cp "$RUNNER_TEMP/delivery/wheels/"*.whl "$RUNNER_TEMP/assets/"
      - name: Upload Linux release assets
        if: inputs.release-tag != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: linux-release-assets
          path: ${{ runner.temp }}/assets/*
          compression-level: 0
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Summarize command timings
        if: always()
        shell: bash
        run: python "$RUNNER_TEMP/delivery/summarize_timings.py" --reports "$RUNNER_TEMP/reports"
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: linux-consumer-reports
          path: ${{ runner.temp }}/reports
          overwrite: true
          retention-days: 14

  windows:
    name: Windows desktop
    needs: metadata
    if: needs.metadata.outputs.scope == 'full' || needs.metadata.outputs.scope == 'baseline' || needs.metadata.outputs.scope == 'release'
    runs-on: windows-2022
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ needs.metadata.outputs.baseline-python }}
      - name: Check Windows toolchain
        id: toolchain
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products '*' -version '[17.0,18.0)' `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -or !$vs) { throw 'Visual Studio 2022 C++ tools are required' }
          "VCPKG_VISUAL_STUDIO_PATH=$vs" >> $env:GITHUB_ENV
          "image=$env:ImageVersion" >> $env:GITHUB_OUTPUT
          Write-Host "Using $vs (runner image $env:ImageVersion)"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: microsoft/vcpkg
          ref: ${{ needs.metadata.outputs.vcpkg-baseline }}
          path: out/tools/vcpkg
          persist-credentials: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: vcpkg-win2022-release-v2-${{ steps.toolchain.outputs.image }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/ports/**', 'cmake/triplets/ci/**') }}
          restore-keys: |
            vcpkg-win2022-release-v2-${{ steps.toolchain.outputs.image }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/ports/**', 'cmake/triplets/ci/**') }}-
            vcpkg-win2022-release-v2-
      - name: Install dependencies
        id: dependencies
        run: |
          & out/tools/vcpkg/bootstrap-vcpkg.bat -disableMetrics
          if ($LASTEXITCODE) { throw 'vcpkg bootstrap failed' }
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/vcpkg-binary-cache" | Out-Null
          $env:VCPKG_BINARY_SOURCES = "clear;files,$env:RUNNER_TEMP/vcpkg-binary-cache,readwrite"
          & out/tools/vcpkg/vcpkg.exe install --x-manifest-root=. `
            --x-install-root=out/dependencies/installed --x-buildtrees-root=out/dependencies/buildtrees `
            --x-packages-root=out/dependencies/packages --downloads-root=out/dependencies/downloads `
            --overlay-triplets=cmake/triplets/ci --triplet=x64-windows-release `
            --host-triplet=x64-windows-release --x-no-default-features --x-feature=tests `
            --x-feature=time-frames --x-feature=spice --x-feature=graphics --clean-after-build
          if ($LASTEXITCODE) { throw 'vcpkg install failed' }
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        # Keep completed packages even if a later dependency fails. A unique
        # partial key lets subsequent attempts extend the immutable cache.
        if: ${{ !cancelled() && steps.cache.outputs.cache-primary-key != '' && steps.cache.outputs.cache-hit != 'true' }}
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: ${{ steps.cache.outputs.cache-primary-key }}${{ steps.dependencies.outcome != 'success' && format('-partial-{0}-{1}', github.run_id, github.run_attempt) || '' }}
      - uses: ./.github/actions/compiler-cache
      - name: Compile and test; package only for a release tag
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          CI_SCOPE: ${{ needs.metadata.outputs.scope }}
        run: |
          $checkArgs = @('--dependency-prefix', 'out/dependencies/installed/x64-windows-release',
            '--work', "$env:RUNNER_TEMP/windows", '--reports', "$env:RUNNER_TEMP/reports/windows",
            '--version', $env:VERSION)
          if ($env:CI_SCOPE -eq 'release') {
            $checkArgs += @('--release', '--output', "$env:RUNNER_TEMP/assets")
          } else {
            $checkArgs += '--skip-python'
          }
          python tools/ci/check_windows.py @checkArgs
          if ($LASTEXITCODE) { throw 'Windows validation failed' }
      - name: Upload Windows release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: inputs.release-tag != ''
        with:
          name: windows-release-assets
          path: ${{ runner.temp }}/assets/*
          compression-level: 0
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Summarize command timings
        if: always()
        shell: bash
        run: python tools/ci/summarize_timings.py --reports "$RUNNER_TEMP/reports"
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-reports
          path: |
            ${{ runner.temp }}/reports
            out/dependencies/installed/vcpkg/status
            out/dependencies/buildtrees/**/*.log
          overwrite: true
          retention-days: 14

  python-linux:
    name: Linux compatibility
    needs: metadata
    if: needs.metadata.outputs.scope == 'full' || needs.metadata.outputs.scope == 'baseline' || needs.metadata.outputs.scope == 'release'
    uses: ./.github/workflows/python.yml
    with:
      platform: linux
      vcpkg-baseline: ${{ needs.metadata.outputs.vcpkg-baseline }}
      baseline-python: ${{ needs.metadata.outputs.baseline-python }}
      python-versions: >-
        ${{ needs.metadata.outputs.scope == 'baseline' && format('["{0}"]', needs.metadata.outputs.baseline-python)
            || needs.metadata.outputs.scope == 'release' && needs.metadata.outputs.python-matrix
            || needs.metadata.outputs.python-versions }}
      release: ${{ inputs.release-tag != '' }}

  python-windows:
    name: Windows compatibility
    needs: metadata
    if: needs.metadata.outputs.scope == 'full' || needs.metadata.outputs.scope == 'baseline' || needs.metadata.outputs.scope == 'release'
    uses: ./.github/workflows/python.yml
    with:
      platform: windows
      vcpkg-baseline: ${{ needs.metadata.outputs.vcpkg-baseline }}
      baseline-python: ${{ needs.metadata.outputs.baseline-python }}
      python-versions: >-
        ${{ needs.metadata.outputs.scope == 'baseline' && format('["{0}"]', needs.metadata.outputs.baseline-python)
            || needs.metadata.outputs.scope == 'release' && needs.metadata.outputs.python-matrix
            || needs.metadata.outputs.python-versions }}
      release: ${{ inputs.release-tag != '' }}

  passed:
    name: CI passed
    if: always()
    needs: [metadata, linux, linux-consumer, windows, python-linux, python-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Require every check
        env:
          CI_SCOPE: ${{ needs.metadata.outputs.scope }}
          RESULTS: ${{ toJSON(needs) }}
        run: python3 tools/ci/plan_ci.py check
