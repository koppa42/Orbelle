name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      release-tag:
        type: string
        default: ''
    outputs:
      version:
        value: ${{ jobs.metadata.outputs.version }}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUTF8: '1'
  VCPKG_DISABLE_METRICS: '1'
  VCPKG_MAX_CONCURRENCY: '4'
  CMAKE_BUILD_PARALLEL_LEVEL: '4'

jobs:
  metadata:
    name: Versions and tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      vcpkg-baseline: ${{ steps.version.outputs.vcpkg-baseline }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Check versions and release tag
        id: version
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          args=()
          if [[ -n "$RELEASE_TAG" ]]; then args+=(--tag "$RELEASE_TAG"); fi
          python tools/ci/version.py --github-output "${args[@]}"
      - name: Test data and delivery tools
        run: |
          python -m unittest discover -s tools/data/tests -v
          python -m unittest discover -s tests/packaging -v

  linux:
    name: Linux C++, sanitizers and wheel
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: microsoft/vcpkg
          ref: ${{ needs.metadata.outputs.vcpkg-baseline }}
          path: out/tools/vcpkg
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/linux/dependencies/binary-cache
          key: vcpkg-ubuntu24-x64-v1-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/ports/**') }}
          restore-keys: vcpkg-ubuntu24-x64-v1-
      - name: Prepare toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang ninja-build ncompress pkg-config python3-dev python3-venv
          out/tools/vcpkg/bootstrap-vcpkg.sh -disableMetrics
      - name: Build, test and export
        run: |
          python tools/ci/check_linux.py --source "$GITHUB_WORKSPACE" \
            --vcpkg-root "$GITHUB_WORKSPACE/out/tools/vcpkg" \
            --work "$RUNNER_TEMP/linux" --reports "$RUNNER_TEMP/reports/linux-build" \
            --delivery "$RUNNER_TEMP/delivery"
          tar -czf "$RUNNER_TEMP/linux-delivery.tar.gz" -C "$RUNNER_TEMP/delivery" .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: linux-delivery
          path: ${{ runner.temp }}/linux-delivery.tar.gz
          compression-level: 0
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: linux-build-reports
          path: ${{ runner.temp }}/reports
          overwrite: true
          retention-days: 14

  linux-consumer:
    name: Linux SDK and installed Python API
    needs: [metadata, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Deliberately no source checkout: the delivery must work on its own.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: linux-delivery
          path: ${{ runner.temp }}/input
      - name: Validate relocated SDK and wheel
        run: |
          mkdir "$RUNNER_TEMP/delivery"
          tar -xzf "$RUNNER_TEMP/input/linux-delivery.tar.gz" -C "$RUNNER_TEMP/delivery"
          python "$RUNNER_TEMP/delivery/check_linux.py" --stage consumer \
            --delivery "$RUNNER_TEMP/delivery" --work "$RUNNER_TEMP/consumer" \
            --reports "$RUNNER_TEMP/reports/linux-consumer"
      - name: Prepare release assets
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          python "$RUNNER_TEMP/delivery/package_sdk.py" --sdk "$RUNNER_TEMP/delivery/sdk" \
            --dependencies "$RUNNER_TEMP/delivery/dependencies" --version "$VERSION" \
            --platform linux-x64 --output "$RUNNER_TEMP/assets"
          cp "$RUNNER_TEMP/delivery/wheels/"*.whl "$RUNNER_TEMP/assets/"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: linux-release-assets
          path: ${{ runner.temp }}/assets/*
          compression-level: 0
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: linux-consumer-reports
          path: ${{ runner.temp }}/reports
          overwrite: true
          retention-days: 14

  windows:
    name: Windows desktop, SDK and wheel
    needs: metadata
    runs-on: windows-2025
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: microsoft/vcpkg
          ref: ${{ needs.metadata.outputs.vcpkg-baseline }}
          path: out/tools/vcpkg
          persist-credentials: false
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: cache
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: vcpkg-win2025-x64-v1-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/ports/**') }}
          restore-keys: vcpkg-win2025-x64-v1-
      - name: Install dependencies
        run: |
          & out/tools/vcpkg/bootstrap-vcpkg.bat -disableMetrics
          if ($LASTEXITCODE) { throw 'vcpkg bootstrap failed' }
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/vcpkg-binary-cache" | Out-Null
          $env:VCPKG_BINARY_SOURCES = "clear;files,$env:RUNNER_TEMP/vcpkg-binary-cache,readwrite"
          & out/tools/vcpkg/vcpkg.exe install --x-manifest-root=. `
            --x-install-root=out/dependencies/installed --x-buildtrees-root=out/dependencies/buildtrees `
            --x-packages-root=out/dependencies/packages --downloads-root=out/dependencies/downloads `
            --triplet=x64-windows --x-no-default-features --x-feature=tests `
            --x-feature=time-frames --x-feature=spice --x-feature=graphics --clean-after-build
          if ($LASTEXITCODE) { throw 'vcpkg install failed' }
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Build, test and package
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          python tools/ci/check_windows.py --dependency-prefix out/dependencies/installed/x64-windows `
            --work "$env:RUNNER_TEMP/windows" --reports "$env:RUNNER_TEMP/reports/windows" `
            --output "$env:RUNNER_TEMP/assets" --version "$env:VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-release-assets
          path: ${{ runner.temp }}/assets/*
          compression-level: 0
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-reports
          path: |
            ${{ runner.temp }}/reports
            out/dependencies/installed/vcpkg/status
            out/dependencies/buildtrees/**/*.log
          overwrite: true
          retention-days: 14

  passed:
    name: CI passed
    if: always()
    needs: [metadata, linux, linux-consumer, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every check
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 -c 'import json, os; results=json.loads(os.environ["RESULTS"]); assert all(job["result"] == "success" for job in results.values()), results'
