name: Sanitizers

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sanitizers-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUTF8: '1'
  VCPKG_DISABLE_METRICS: '1'
  VCPKG_MAX_CONCURRENCY: '4'
  CMAKE_BUILD_PARALLEL_LEVEL: '4'

jobs:
  sanitizers:
    name: Linux ASan/UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Read pinned toolchain versions
        id: version
        run: python3 tools/ci/version.py --github-output
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.version.outputs.baseline-python }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: microsoft/vcpkg
          ref: ${{ steps.version.outputs.vcpkg-baseline }}
          path: out/tools/vcpkg
          persist-credentials: false
      - uses: ./.github/actions/dependency-cache-restore
        with:
          profile: linux
          path: ${{ runner.temp }}/linux/dependencies/binary-cache
          state: ${{ runner.temp }}/reports/dependency-cache
      - name: Prepare toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang ninja-build ncompress pkg-config python3-dev python3-venv
          out/tools/vcpkg/bootstrap-vcpkg.sh -disableMetrics
      - name: Compile and run all sanitizer tests
        run: |
          python tools/ci/check_linux.py --stage sanitizers \
            --source "$GITHUB_WORKSPACE" --vcpkg-root "$GITHUB_WORKSPACE/out/tools/vcpkg" \
            --work "$RUNNER_TEMP/linux" --reports "$RUNNER_TEMP/reports/linux-sanitizers"
      - uses: ./.github/actions/dependency-cache-save
        if: always()
        timeout-minutes: 4
        with:
          state: ${{ runner.temp }}/reports/dependency-cache
          installed: ${{ runner.temp }}/linux/dependencies/installed
          buildtrees: ${{ runner.temp }}/linux/dependencies/buildtrees
          log: ${{ runner.temp }}/reports/linux-sanitizers/dependencies.log
      - name: Summarize command timings
        if: always()
        run: python tools/ci/summarize_timings.py --reports "$RUNNER_TEMP/reports"
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: linux-sanitizer-reports
          path: |
            ${{ runner.temp }}/reports
            ${{ runner.temp }}/linux/dependencies/buildtrees/**/*vcpkg_abi_info.txt
            ${{ runner.temp }}/linux/dependencies/installed/*/share/*/vcpkg_abi_info.txt
          overwrite: true
          retention-days: 14
