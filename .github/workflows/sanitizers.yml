name: Sanitizers

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sanitizers-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUTF8: '1'
  VCPKG_DISABLE_METRICS: '1'
  VCPKG_MAX_CONCURRENCY: '4'
  CMAKE_BUILD_PARALLEL_LEVEL: '4'

jobs:
  sanitizers:
    name: Linux ASan/UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Read pinned toolchain versions
        id: version
        run: python3 tools/ci/version.py --github-output
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.version.outputs.baseline-python }}
      - name: Identify runner image
        id: toolchain
        run: echo "image=$ImageVersion" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: microsoft/vcpkg
          ref: ${{ steps.version.outputs.vcpkg-baseline }}
          path: out/tools/vcpkg
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: ${{ runner.temp }}/linux/dependencies/binary-cache
          key: vcpkg-ubuntu24-x64-v1-${{ steps.toolchain.outputs.image }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/ports/**', 'tools/ci/check_linux.py') }}
          restore-keys: |
            vcpkg-ubuntu24-x64-v1-${{ steps.toolchain.outputs.image }}-
            vcpkg-ubuntu24-x64-v1-
      - name: Prepare toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang ninja-build ncompress pkg-config python3-dev python3-venv
          out/tools/vcpkg/bootstrap-vcpkg.sh -disableMetrics
      - name: Compile and run all sanitizer tests
        run: |
          python tools/ci/check_linux.py --stage sanitizers \
            --source "$GITHUB_WORKSPACE" --vcpkg-root "$GITHUB_WORKSPACE/out/tools/vcpkg" \
            --work "$RUNNER_TEMP/linux" --reports "$RUNNER_TEMP/reports/linux-sanitizers"
      - name: Summarize command timings
        if: always()
        run: python tools/ci/summarize_timings.py --reports "$RUNNER_TEMP/reports"
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: linux-sanitizer-reports
          path: ${{ runner.temp }}/reports
          overwrite: true
          retention-days: 14
