name: Python compatibility

on:
  workflow_call:
    inputs:
      platform:
        type: string
        required: true
      vcpkg-baseline:
        type: string
        required: true
      baseline-python:
        type: string
        required: true
      python-versions:
        type: string
        required: true
      release:
        type: boolean
        default: false

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUTF8: '1'
  VCPKG_DISABLE_METRICS: '1'
  VCPKG_MAX_CONCURRENCY: '4'
  CMAKE_BUILD_PARALLEL_LEVEL: '4'

jobs:
  dependencies:
    name: Python dependencies / ${{ inputs.platform }}
    runs-on: ${{ inputs.platform == 'linux' && 'ubuntu-24.04' || 'windows-2022' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.baseline-python }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: microsoft/vcpkg
          ref: ${{ inputs.vcpkg-baseline }}
          path: out/tools/vcpkg
          persist-credentials: false
      # Keep literal paths for legacy Python snapshots, but restore only this
      # profile's keys. Desktop snapshots are never used as a Python fallback.
      - uses: ./.github/actions/dependency-cache-restore
        with:
          profile: python-${{ inputs.platform }}
          path: ${{ runner.temp }}/${{ inputs.platform == 'linux' && 'linux/dependencies/binary-cache' || 'vcpkg-binary-cache' }}
          state: ${{ runner.temp }}/python-deps/cache-report
      - name: Prepare Linux dependency tools
        if: inputs.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential ninja-build ncompress pkg-config
      - name: Restore or build headless dependencies
        shell: python {0}
        env:
          DEPENDENCY_CACHE: ${{ runner.temp }}/${{ inputs.platform == 'linux' && 'linux/dependencies/binary-cache' || 'vcpkg-binary-cache' }}
        run: |
          import os, pathlib, subprocess, sys
          source = pathlib.Path.cwd()
          work = pathlib.Path(os.environ['RUNNER_TEMP']) / 'python-deps'
          work.mkdir(parents=True, exist_ok=True)
          cache = pathlib.Path(os.environ['DEPENDENCY_CACHE'])
          cache.mkdir(parents=True, exist_ok=True)
          vcpkg = source / 'out/tools/vcpkg'
          windows = os.name == 'nt'
          subprocess.run([str(vcpkg / ('bootstrap-vcpkg.bat' if windows else 'bootstrap-vcpkg.sh')),
                          '-disableMetrics'], check=True)
          triplet = 'x64-windows-release' if windows else 'x64-linux'
          command = [str(vcpkg / ('vcpkg.exe' if windows else 'vcpkg')), 'install',
              '--x-abi-tools-use-exact-versions',
              f'--x-manifest-root={source}', f'--x-install-root={work / "installed"}',
              f'--x-buildtrees-root={work / "buildtrees"}', f'--x-packages-root={work / "packages"}',
              f'--downloads-root={work / "downloads"}', f'--triplet={triplet}',
              '--x-no-default-features', '--x-feature=time-frames', '--x-feature=spice',
              '--x-feature=data-catalog', '--clean-after-build']
          if windows:
              command += [f'--overlay-triplets={source / "cmake/triplets/ci"}', f'--host-triplet={triplet}']
          with (work / 'cache-report/install.log').open('w', encoding='utf-8') as log:
              with subprocess.Popen(command, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                      text=True, errors='replace',
                      env=dict(os.environ, VCPKG_BINARY_SOURCES=f'clear;files,{cache},readwrite')) as process:
                  for line in process.stdout:
                      log.write(line)
                      log.flush()
                      print(line, end='', flush=True)
                  if process.wait():
                      raise subprocess.CalledProcessError(process.returncode, command)
          subprocess.run([sys.executable, 'tools/ci/export_python_dependencies.py',
              '--dependency-prefix', str(work / 'installed' / triplet),
              '--output', str(work / 'python-dependencies.tar.gz')], check=True)
      - uses: ./.github/actions/dependency-cache-save
        if: always()
        timeout-minutes: 4
        with:
          state: ${{ runner.temp }}/python-deps/cache-report
          installed: ${{ runner.temp }}/python-deps/installed
          buildtrees: ${{ runner.temp }}/python-deps/buildtrees
          log: ${{ runner.temp }}/python-deps/cache-report/install.log
      - name: Upload Python test dependencies
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ inputs.platform }}-python-dependencies
          path: ${{ runner.temp }}/python-deps/python-dependencies.tar.gz
          compression-level: 0
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Upload dependency diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: python-dependencies-${{ inputs.platform }}-reports
          path: |
            ${{ runner.temp }}/python-deps/cache-report
            ${{ runner.temp }}/python-deps/installed/vcpkg/status
            ${{ runner.temp }}/python-deps/buildtrees/**/*.log
            ${{ runner.temp }}/python-deps/buildtrees/**/*vcpkg_abi_info.txt
            ${{ runner.temp }}/python-deps/installed/*/share/*/vcpkg_abi_info.txt
          retention-days: 14

  python:
    needs: dependencies
    name: Python ${{ matrix.python }} / ${{ inputs.platform }}
    runs-on: ${{ inputs.platform == 'linux' && 'ubuntu-24.04' || 'windows-2022' }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(inputs.python-versions) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ inputs.platform }}-python-dependencies
          path: ${{ runner.temp }}/input
      - uses: ./.github/actions/compiler-cache
      - name: Test Python API; build and install a wheel only for release
        shell: python {0}
        env:
          CI_SCOPE: ${{ inputs.release && 'release' || 'full' }}
          BUILD_CPP_EXAMPLE: ${{ !inputs.release && matrix.python == inputs.baseline-python && 'true' || 'false' }}
        run: |
          import os, pathlib, subprocess, sys, tarfile
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          with tarfile.open(root / 'input/python-dependencies.tar.gz') as archive:
              archive.extractall(root / 'delivery', filter='data')
          command = [sys.executable, 'tools/ci/check_python.py',
              '--dependency-prefix', str(root / 'delivery/dependencies'),
              '--work', str(root / 'python'), '--reports', str(root / 'reports')]
          if os.environ['CI_SCOPE'] == 'release':
              command += ['--release', '--output', str(root / 'assets')]
          elif os.environ['BUILD_CPP_EXAMPLE'] == 'true':
              command += ['--build-cpp-example']
          subprocess.run(command, check=True)
      - name: Upload Python release wheel
        if: inputs.release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: python-${{ matrix.python }}-${{ inputs.platform }}-release-assets
          path: ${{ runner.temp }}/assets/*.whl
          compression-level: 0
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Summarize command timings
        if: always()
        shell: bash
        run: python tools/ci/summarize_timings.py --reports "$RUNNER_TEMP/reports"
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: python-${{ matrix.python }}-${{ inputs.platform }}-reports
          path: ${{ runner.temp }}/reports
          overwrite: true
          retention-days: 14
