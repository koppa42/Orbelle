[build-system]
requires = ["scikit-build-core==0.12.2", "pybind11==3.0.4"]
build-backend = "scikit_build_core.build"

[project]
name = "orbitforge"
version = "0.1.0"
description = "OrbitForge P0 standalone computation skeleton"
readme = "README.md"
requires-python = ">=3.11"
classifiers = ["Programming Language :: Python :: 3", "Programming Language :: C++"]

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.28"
wheel.packages = ["bindings/python/src/orbitforge"]
install.components = ["Python"]
build-dir = "out/build/wheel/{wheel_tag}"
sdist.exclude = ["out", "local", ".git"]

[tool.scikit-build.cmake.define]
BUILD_TESTING = "OFF"
ORBITFORGE_BUILD_PYTHON = "ON"
ORBITFORGE_BUILD_APPLICATION = "ON"
ORBITFORGE_WITH_ERFA = "ON"
ORBITFORGE_WITH_DATA_CATALOG = "ON"
ORBITFORGE_WITH_SPICE = "ON"
ORBITFORGE_BUILD_VISUALIZATION = "OFF"
ORBITFORGE_BUILD_DESKTOP = "OFF"
ORBITFORGE_BUILD_EXAMPLES = "OFF"
ORBITFORGE_INSTALL_SDK = "OFF"

