[build-system]
requires = ["scikit-build-core==0.12.2", "pybind11==3.1.0"]
build-backend = "scikit_build_core.build"

[project]
name = "orbelle"
version = "0.3.1"
description = "Orbelle orbital analysis, scenario management, and reporting"
readme = "README.md"
requires-python = ">=3.11"
classifiers = ["Programming Language :: Python :: 3", "Programming Language :: C++"]

[project.urls]
Repository = "https://github.com/koppa42/Orbelle"
Issues = "https://github.com/koppa42/Orbelle/issues"

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.28"
wheel.packages = ["bindings/python/src/orbelle"]
install.components = ["Python"]
build-dir = "out/build/wheel/{wheel_tag}"
sdist.exclude = ["out", "local", ".git"]

[tool.orbelle.ci]
baseline-python = "3.13"
python-versions = ["3.11", "3.12", "3.13", "3.14", "3.15"]

[tool.scikit-build.cmake.define]
BUILD_TESTING = "OFF"
ORBELLE_BUILD_PYTHON = "ON"
ORBELLE_BUILD_APPLICATION = "ON"
ORBELLE_WITH_ERFA = "ON"
ORBELLE_WITH_DATA_CATALOG = "ON"
ORBELLE_WITH_SPICE = "ON"
ORBELLE_BUILD_VISUALIZATION = "OFF"
ORBELLE_BUILD_DESKTOP = "OFF"
ORBELLE_BUILD_EXAMPLES = "OFF"
ORBELLE_INSTALL_SDK = "OFF"

